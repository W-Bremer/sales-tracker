<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker - Bulkloads.com</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: white; overflow: hidden; }

        /* Announcement Banner */
        .announcement-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #f7941d, #ffb347, #f7941d);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            padding: 14px 40px;
            text-align: center;
            z-index: 1000;
        }
        .announcement-text {
            font-size: 1.6rem;
            font-weight: 900;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            width: 94%;
            max-width: 1400px;
            padding: 20px 40px 20px;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        .header { margin-bottom: 16px; }
        .company-logo { margin-bottom: 4px; }
        .company-logo img { height: 48px; width: auto; }
        .week-label { font-size: 1.2rem; color: #8bc53f; font-weight: 600; }

        /* Top stats row */
        .top-section {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 20px;
        }
        .stats-container {
            display: flex;
            gap: 50px;
            flex-shrink: 0;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.9rem; color: #b0b0b0; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .stat-value { font-size: 4.5rem; font-weight: 900; line-height: 1; }
        .current-sales { color: #8bc53f; text-shadow: 0 0 30px rgba(139, 197, 63, 0.5); }
        .goal-value { color: #f7941d; text-shadow: 0 0 30px rgba(247, 148, 29, 0.5); }

        .progress-section { flex: 1; min-width: 0; }
        .progress-bar-container { background: rgba(255, 255, 255, 0.1); border-radius: 20px; height: 52px; position: relative; overflow: hidden; box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.5); }
        .progress-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #6b9b2d 0%, #8bc53f 50%, #a8d957 100%); transition: width 1s ease-out; position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; min-width: 100px; }
        .progress-bar.near-goal { background: linear-gradient(90deg, #d97b0d 0%, #f7941d 50%, #ffb347 100%); animation: pulse 1s ease-in-out infinite; }
        .progress-bar.goal-reached { background: linear-gradient(90deg, #f7941d 0%, #ffd700 30%, #f7941d 50%, #ffd700 70%, #f7941d 100%); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .progress-text { font-size: 1.6rem; font-weight: 800; color: rgba(0, 0, 0, 0.8); }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .percentage-display { font-size: 2.2rem; font-weight: 900; }
        .percentage-display.normal { color: #8bc53f; }
        .percentage-display.near-goal { color: #f7941d; }
        .percentage-display.goal-reached { color: #ffd700; animation: glow 1s ease-in-out infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 20px #f7941d, 0 0 40px #f7941d; } to { text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd700; } }
        .message { font-size: 1.6rem; font-weight: 700; }
        .message.crushing-it { color: #8bc53f; }
        .message.almost-there { color: #f7941d; animation: bounce 0.5s ease infinite; }
        .message.goal-reached { color: #ffd700; font-size: 2rem; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .remaining { color: #8bc53f; font-size: 1rem; }

        /* Leaderboard */
        .leaderboard-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            min-height: 0;
        }
        .leaderboard-title {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f7941d;
            margin-bottom: 12px;
            text-align: left;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
            flex: 1;
        }
        .leaderboard-table thead th {
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            text-align: center;
            border-bottom: 2px solid rgba(247, 148, 29, 0.3);
        }
        .leaderboard-table thead th:first-child {
            text-align: left;
            padding-left: 24px;
        }
        .leaderboard-table thead th:last-child {
            text-align: right;
            padding-right: 24px;
        }
        .leaderboard-table tbody tr {
            background: rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .leaderboard-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .leaderboard-table tbody tr.top-performer {
            background: rgba(139, 197, 63, 0.1);
            box-shadow: 0 0 20px rgba(139, 197, 63, 0.08);
        }
        .leaderboard-table tbody tr.top-performer td:first-child {
            color: #8bc53f;
        }
        .leaderboard-table tbody tr.totals-row {
            background: rgba(247, 148, 29, 0.12);
            border-top: 2px solid rgba(247, 148, 29, 0.3);
        }
        .leaderboard-table tbody td {
            padding: 12px 16px;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            color: #ddd;
            border-radius: 0;
        }
        .leaderboard-table tbody tr td:first-child {
            border-radius: 12px 0 0 12px;
        }
        .leaderboard-table tbody tr td:last-child {
            border-radius: 0 12px 12px 0;
        }
        .leaderboard-table tbody td:first-child {
            text-align: left;
            padding-left: 24px;
            font-size: 1.4rem;
        }
        .leaderboard-table tbody td:last-child {
            text-align: right;
            padding-right: 24px;
        }
        .salesman-name {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 900;
            flex-shrink: 0;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #f7941d); color: #1a1a1a; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #1a1a1a; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #a0622e); color: #1a1a1a; }
        .rank-other { background: rgba(255, 255, 255, 0.1); color: #888; }

        .monthly-total {
            font-size: 1.6rem !important;
            font-weight: 900 !important;
            color: #8bc53f !important;
        }
        .totals-row td {
            color: #f7941d !important;
            font-weight: 800 !important;
            font-size: 1.4rem !important;
        }
        .totals-row .monthly-total {
            color: #f7941d !important;
        }
        .totals-label {
            font-size: 1.2rem !important;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f7941d !important;
        }

        .week-highlight {
            position: relative;
        }

        .last-updated { position: fixed; bottom: 10px; right: 20px; color: rgba(255, 255, 255, 0.3); font-size: 0.8rem; }
        .error-message { background: rgba(244, 67, 54, 0.2); border: 2px solid #f44336; border-radius: 10px; padding: 20px; margin: 20px 0; color: #ff8a80; }

        /* Explosion Animation */
        .explosion-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; pointer-events: none; opacity: 0;
        }
        .explosion-overlay.active { animation: explosionFade 3s ease-out forwards; }
        @keyframes explosionFade { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
        .explosion-text {
            font-size: 6rem; font-weight: 900; color: #f7941d;
            text-shadow: 0 0 50px #8bc53f, 0 0 100px #f7941d, 0 0 150px #8bc53f;
            animation: explodeText 3s ease-out forwards;
        }
        @keyframes explodeText { 0% { transform: scale(0.5); opacity: 0; } 20% { transform: scale(1.5); opacity: 1; } 40% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 0; } }
        .confetti { position: fixed; width: 15px; height: 15px; top: -20px; z-index: 1999; animation: confettiFall 3s ease-out forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        /* Current week column glow */
        .current-week-cell {
            color: #fff !important;
            text-shadow: 0 0 8px rgba(139, 197, 63, 0.4);
        }
        .current-week-header {
            color: #8bc53f !important;
            position: relative;
        }
        .current-week-header::after {
            content: '◄';
            margin-left: 6px;
            font-size: 0.7rem;
            color: #8bc53f;
        }
    </style>
</head>
<body>
    <div class="announcement-banner" id="announcementBanner">
        <div class="announcement-text" id="announcementText">Loading...</div>
    </div>

    <div class="explosion-overlay" id="explosionOverlay">
        <div class="explosion-text">🎉 NEW SALE! 🎉</div>
    </div>

    <div class="container">
        <div class="header">
            <div class="company-logo"><img src="https://bulkloads.com/_next/static/media/bulkloads_logo.acf79a5a.png" alt="BulkLoads"></div>
            <div class="week-label">Monthly Sales Tracker</div>
        </div>
        <div id="topContent"></div>
        <div id="leaderboardContent"></div>
        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        var SHEET_URL = "https://script.google.com/macros/s/AKfycbytOkDuaapqYBBeTk9i5bP_aQElt4TrWJAFqbtJQ0hw6xTnOmiJi5od5oyAhJ4vSW1HbQ/exec";
        var currentSales = 0;
        var salesGoal = 0;
        var previousSales = -1;
        var announcement = "";
        var salespeople = [];

        function showError(msg) {
            document.getElementById("topContent").innerHTML = "<div class='error-message'><h3>Error</h3><p>" + msg + "</p></div>";
        }

        function createConfetti() {
            var colors = ['#f7941d', '#ffb347', '#8bc53f', '#a8d957', '#ffd700', '#ffffff'];
            for (var i = 0; i < 50; i++) {
                var confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(function(el) { el.remove(); }, 4000, confetti);
            }
        }

        function triggerExplosion() {
            var overlay = document.getElementById('explosionOverlay');
            overlay.classList.remove('active');
            void overlay.offsetWidth;
            overlay.classList.add('active');
            createConfetti();
            setTimeout(function() { overlay.classList.remove('active'); }, 3500);
        }

        function getCurrentWeek() {
            // Determine which week of the month we're in (1-4)
            var now = new Date();
            var day = now.getDate();
            if (day <= 7) return 1;
            if (day <= 14) return 2;
            if (day <= 21) return 3;
            return 4;
        }

        function updateDisplay() {
            var pct = salesGoal > 0 ? Math.min((currentSales / salesGoal) * 100, 100) : 0;
            var near = pct >= 80 && pct < 100;
            var done = currentSales >= salesGoal;
            var pc = "", pcc = "normal", msg = "", mc = "";

            if (done) { pc = "goal-reached"; pcc = "goal-reached"; msg = "GOAL REACHED!"; mc = "goal-reached"; }
            else if (near) { pc = "near-goal"; pcc = "near-goal"; msg = "ALMOST THERE!"; mc = "almost-there"; }
            else if (pct >= 50) { msg = "CRUSHING IT!"; mc = "crushing-it"; }
            else if (pct >= 25) { msg = "GREAT START!"; mc = "crushing-it"; }
            else { msg = "LET'S GO!"; mc = "crushing-it"; }

            var rem = Math.max(0, salesGoal - currentSales);
            var html = "<div class='top-section'>" +
                "<div class='stats-container'>" +
                "<div class='stat-box'><div class='stat-label'>Sales</div><div class='stat-value current-sales'>" + currentSales + "</div></div>" +
                "<div class='stat-box'><div class='stat-label'>Goal</div><div class='stat-value goal-value'>" + salesGoal + "</div></div>" +
                "</div>" +
                "<div class='progress-section'>" +
                "<div class='progress-bar-container'><div class='progress-bar " + pc + "' style='width:" + Math.max(pct, 8) + "%'><span class='progress-text'>" + currentSales + " / " + salesGoal + "</span></div></div>" +
                "<div class='progress-meta'>" +
                "<div class='percentage-display " + pcc + "'>" + pct.toFixed(0) + "%</div>" +
                "<div class='message " + mc + "'>" + msg + "</div>" +
                (done ? "" : "<div class='remaining'>" + rem + " to go</div>") +
                "</div></div></div>";

            document.getElementById("topContent").innerHTML = html;

            // Leaderboard
            if (salespeople.length > 0) {
                var currentWeek = getCurrentWeek();
                var numWeeks = 0;
                if (salespeople.length > 0 && salespeople[0].weeks) {
                    numWeeks = salespeople[0].weeks.length;
                }

                // Sort by monthly total descending for ranking
                var sorted = salespeople.slice().sort(function(a, b) { return b.total - a.total; });
                var rankMap = {};
                sorted.forEach(function(p, i) { rankMap[p.name] = i + 1; });

                // Week headers
                var weekHeaders = "";
                for (var w = 0; w < numWeeks; w++) {
                    var isCurrentWeek = (w + 1) === currentWeek;
                    weekHeaders += "<th class='" + (isCurrentWeek ? "current-week-header" : "") + "'>Wk " + (w + 1) + "</th>";
                }

                // Determine the current month name
                var monthName = new Date().toLocaleString('default', { month: 'long' });

                var tableHTML = "<div class='leaderboard-section'>" +
                    "<div class='leaderboard-title'>📊 Salesman Breakdown</div>" +
                    "<table class='leaderboard-table'>" +
                    "<thead><tr><th>Salesman</th>" + weekHeaders + "<th>" + monthName + "</th></tr></thead><tbody>";

                // Rows sorted by total (top performer first)
                sorted.forEach(function(person, idx) {
                    var rank = idx + 1;
                    var rankClass = rank <= 3 ? "rank-" + rank : "rank-other";
                    var isTop = rank === 1;

                    var weekCells = "";
                    for (var w = 0; w < person.weeks.length; w++) {
                        var isCurrentWeek = (w + 1) === currentWeek;
                        weekCells += "<td class='" + (isCurrentWeek ? "current-week-cell" : "") + "'>" + person.weeks[w] + "</td>";
                    }

                    tableHTML += "<tr class='" + (isTop ? "top-performer" : "") + "'>" +
                        "<td><span class='salesman-name'><span class='rank-badge " + rankClass + "'>" + rank + "</span>" + person.name + "</span></td>" +
                        weekCells +
                        "<td class='monthly-total'>" + person.total + "</td></tr>";
                });

                // Totals row
                var weekTotals = [];
                for (var w = 0; w < numWeeks; w++) {
                    var wTotal = 0;
                    salespeople.forEach(function(p) { wTotal += (p.weeks[w] || 0); });
                    weekTotals.push(wTotal);
                }
                var grandTotal = 0;
                salespeople.forEach(function(p) { grandTotal += p.total; });

                var totalCells = "";
                for (var w = 0; w < weekTotals.length; w++) {
                    var isCurrentWeek = (w + 1) === currentWeek;
                    totalCells += "<td class='" + (isCurrentWeek ? "current-week-cell" : "") + "'>" + weekTotals[w] + "</td>";
                }

                tableHTML += "<tr class='totals-row'><td class='totals-label'>Team Total</td>" +
                    totalCells +
                    "<td class='monthly-total'>" + grandTotal + "</td></tr>";

                tableHTML += "</tbody></table></div>";
                document.getElementById("leaderboardContent").innerHTML = tableHTML;
            }
        }

        function fetchData() {
            fetch(SHEET_URL + "?_=" + Date.now())
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    var newSales = parseInt(data.currentSales) || 0;
                    var newGoal = parseInt(data.goal) || 0;

                    if (previousSales >= 0 && newSales > currentSales) {
                        triggerExplosion();
                    }
                    previousSales = currentSales;
                    currentSales = newSales;
                    salesGoal = newGoal;
                    announcement = data.announcement || "";

                    // Parse salespeople data
                    if (data.salespeople && Array.isArray(data.salespeople)) {
                        salespeople = data.salespeople.map(function(row) {
                            return {
                                name: row.name || "",
                                weeks: row.weeks || [],
                                total: parseInt(row.total) || 0
                            };
                        });
                    }

                    // Update announcement banner
                    var bannerEl = document.getElementById("announcementText");
                    if (announcement) {
                        bannerEl.textContent = announcement;
                        document.getElementById("announcementBanner").style.display = "block";
                    } else {
                        document.getElementById("announcementBanner").style.display = "none";
                    }

                    updateDisplay();
                    document.getElementById("lastUpdated").textContent = "Updated: " + new Date().toLocaleTimeString();
                })
                .catch(function(err) { showError(err.message); });
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
